<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鍵上樂理</title>
  <meta name="description" content="以 MIDI 鍵盤學習樂理、指法與和弦的成人互動課程">
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23233f7a'/><rect x='6' y='7' width='5' height='18' rx='1.5' fill='%23f5f0e6'/><rect x='13.5' y='7' width='5' height='18' rx='1.5' fill='%23f5f0e6'/><rect x='21' y='7' width='5' height='18' rx='1.5' fill='%23f5f0e6'/><rect x='9.5' y='7' width='3.5' height='11' rx='1' fill='%23161410'/><rect x='17' y='7' width='3.5' height='11' rx='1' fill='%23161410'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="鍵上樂理，回首頁">
      <svg class="brand-mark" viewBox="0 0 28 22" aria-hidden="true"><rect x=".75" y=".75" width="26.5" height="20.5" rx="3"/><path d="M9.75 1v20M18.25 1v20"/><rect class="bk" x="7" y="1" width="5.5" height="12" rx="1"/><rect class="bk" x="15.5" y="1" width="5.5" height="12" rx="1"/></svg>
      <span>鍵上樂理</span>
    </button>
    <div class="topbar-right">
      <span class="pill" id="midi-status">偵測 MIDI 中…</span>
      <button class="icon-btn" id="settings-btn" type="button" aria-haspopup="dialog">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>設定與說明</span>
      </button>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main id="view" class="view"></main>

  <section class="kb-wrap" id="kb-wrap" aria-label="琴鍵">
    <div class="kb-meta">
      <span id="kb-hint"></span>
      <span id="kb-now" class="kb-now"></span>
    </div>
    <div class="kb-scroll">
      <div id="keyboard" class="keyboard" aria-hidden="true"></div>
    </div>
  </section>

  <dialog id="settings" class="dialog" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-body">
      <h2 id="settings-title">設定與說明</h2>

      <h3>怎麼彈</h3>
      <ul class="help-list">
        <li><b>MIDI 鍵盤</b>：用 Chrome 或 Edge 開啟，接上後依提示校準（按最左、最右的鍵）。</li>
        <li><b>電腦鍵盤</b>：<kbd>Z</kbd> 到 <kbd>M</kbd> 是低音 C3–B3，<kbd>Q</kbd> 到 <kbd>I</kbd> 是中央 C4 到 C5，數字列是黑鍵。沒接 MIDI 時，畫面琴鍵上會標出字母。</li>
        <li><b>滑鼠或觸控</b>：直接點畫面上的琴鍵。</li>
        <li><b>回饋</b>：綠色打勾是對，紅色打叉是錯，正確的鍵會亮藍框；有數字的是建議用的手指（1 拇指 → 5 小指）。</li>
      </ul>

      <h3>選項</h3>
      <label class="row-toggle">
        <input type="checkbox" id="set-echo">
        <span><b>MIDI 彈奏回聲</b><small>鍵盤本身有聲音時可關閉，避免重疊。電腦鍵盤與滑鼠一律發聲。</small></span>
      </label>
      <label class="row-toggle">
        <input type="checkbox" id="set-solfege">
        <span><b>顯示唱名</b><small>在音名旁加上 Do Re Mi。</small></span>
      </label>
      <div class="row-toggle row-static">
        <span><b>MIDI 鍵盤校準</b><small id="cal-note">連接 MIDI 鍵盤後才能校準。</small></span>
        <button type="button" class="btn" id="set-calibrate">重新校準</button>
      </div>

      <h3>進度</h3>
      <p class="muted small">進度只存在這個瀏覽器。換電腦或瀏覽器前，先匯出成檔案。</p>
      <div class="row-btns">
        <button type="button" class="btn" id="set-export">匯出進度</button>
        <button type="button" class="btn" id="set-import-btn">匯入進度</button>
        <input type="file" id="set-import" accept="application/json" hidden>
      </div>
      <p class="dialog-msg" id="set-msg" role="status"></p>
      <div class="danger-zone">
        <button type="button" class="btn btn-quiet-danger" id="set-reset">清除所有進度…</button>
      </div>
      <div class="dialog-foot"><button class="btn btn-primary" value="close">完成</button></div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
